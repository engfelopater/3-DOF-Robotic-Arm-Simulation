<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 900" width="100%" height="100%" style="background:#ffffff; font-family:'Segoe UI', Arial, sans-serif;">
  <!-- Title -->
  <text x="400" y="35" text-anchor="middle" font-size="20" font-weight="bold" fill="#0a3d62">AUTOMATED SORTING CONTROL LOGIC FLOWCHART</text>
  <text x="400" y="58" text-anchor="middle" font-size="13" fill="#7f8c8d">State Machine Execution for Industrial Conveyor System</text>

  <!-- Start Node -->
  <rect x="300" y="80" width="200" height="45" rx="22" fill="#27ae60" stroke="#1e8449" stroke-width="2"/>
  <text x="400" y="108" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">START / System Boot</text>

  <!-- Line -->
  <line x1="400" y1="125" x2="400" y2="155" stroke="#2c3e50" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Conveyor Start -->
  <rect x="280" y="155" width="240" height="50" rx="6" fill="#3498db" stroke="#2980b9" stroke-width="2"/>
  <text x="400" y="185" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff">Run Conveyor Motor (PWM=200)</text>

  <!-- Line -->
  <line x1="400" y1="205" x2="400" y2="235" stroke="#2c3e50" stroke-width="2"/>

  <!-- Decision: Item at Infeed? -->
  <polygon points="400,235 520,285 400,335 280,285" fill="#f39c12" stroke="#d68910" stroke-width="2"/>
  <text x="400" y="280" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">IR Sensor</text>
  <text x="400" y="296" text-anchor="middle" font-size="11" fill="#fff">Triggered?</text>

  <!-- Loop back if No -->
  <path d="M 520 285 L 600 285 L 600 180 L 520 180" fill="none" stroke="#e67e22" stroke-width="2"/>
  <text x="560" y="275" font-size="11" font-weight="bold" fill="#e67e22">NO</text>

  <!-- Line Yes -->
  <line x1="400" y1="335" x2="400" y2="365" stroke="#2c3e50" stroke-width="2"/>
  <text x="415" y="352" font-size="11" font-weight="bold" fill="#27ae60">YES</text>

  <!-- Read Sensors Block -->
  <rect x="280" y="365" width="240" height="45" rx="6" fill="#8e44ad" stroke="#71368a" stroke-width="2"/>
  <text x="400" y="392" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">Sample Inductive &amp; ToF Height</text>

  <!-- Line -->
  <line x1="400" y1="410" x2="400" y2="440" stroke="#2c3e50" stroke-width="2"/>

  <!-- Decision: Is Metal? -->
  <polygon points="400,440 520,490 400,540 280,490" fill="#e74c3c" stroke="#c0392b" stroke-width="2"/>
  <text x="400" y="485" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">Inductive Sensor</text>
  <text x="400" y="501" text-anchor="middle" font-size="11" fill="#fff">Active?</text>

  <!-- Branch Metal (YES - Left) -->
  <path d="M 280 490 L 150 490 L 150 560" fill="none" stroke="#c0392b" stroke-width="2"/>
  <text x="200" y="480" font-size="11" font-weight="bold" fill="#c0392b">YES (Metal)</text>

  <!-- Metal Action Block -->
  <rect x="60" y="560" width="180" height="60" rx="6" fill="#e74c3c" stroke="#c0392b" stroke-width="2"/>
  <text x="150" y="585" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">Delay 1500 ms</text>
  <text x="150" y="605" text-anchor="middle" font-size="11" fill="#fff">Actuate Servo Gate 1 (60°)</text>

  <!-- Metal Destination -->
  <rect x="60" y="650" width="180" height="40" rx="6" fill="#c0392b"/>
  <text x="150" y="675" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">Divert to Metal Bin</text>
  <line x1="150" y1="620" x2="150" y2="650" stroke="#c0392b" stroke-width="2"/>

  <!-- Branch Non-Metal (NO - Down) -->
  <line x1="400" y1="540" x2="400" y2="570" stroke="#2c3e50" stroke-width="2"/>
  <text x="415" y="555" font-size="11" font-weight="bold" fill="#2c3e50">NO (Non-Metal)</text>

  <!-- Decision: Height > Threshold? -->
  <polygon points="400,570 520,620 400,670 280,620" fill="#16a085" stroke="#117864" stroke-width="2"/>
  <text x="400" y="615" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">Height &gt; 80mm?</text>

  <!-- Oversized (YES - Right) -->
  <path d="M 520 620 L 650 620 L 650 680" fill="none" stroke="#16a085" stroke-width="2"/>
  <text x="570" y="610" font-size="11" font-weight="bold" fill="#16a085">YES (Tall)</text>

  <!-- Oversize Action -->
  <rect x="560" y="680" width="180" height="60" rx="6" fill="#16a085" stroke="#117864" stroke-width="2"/>
  <text x="650" y="705" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">Delay 2800 ms</text>
  <text x="650" y="725" text-anchor="middle" font-size="11" fill="#fff">Actuate Servo Gate 2 (60°)</text>

  <rect x="560" y="760" width="180" height="40" rx="6" fill="#117864"/>
  <text x="650" y="785" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">Divert to Oversize Bin</text>
  <line x1="650" y1="740" x2="650" y2="760" stroke="#16a085" stroke-width="2"/>

  <!-- Standard (NO - Down) -->
  <line x1="400" y1="670" x2="400" y2="740" stroke="#2c3e50" stroke-width="2"/>
  <text x="415" y="705" font-size="11" font-weight="bold" fill="#2c3e50">NO (Standard)</text>

  <rect x="310" y="740" width="180" height="45" rx="6" fill="#34495e"/>
  <text x="400" y="767" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">Pass to Default Bin</text>

  <!-- Return Path to Loop -->
  <path d="M 150 690 L 150 830 L 400 830 L 750 830 L 750 180 L 520 180" fill="none" stroke="#7f8c8d" stroke-width="2" stroke-dasharray="6,4"/>
  <path d="M 400 785 L 400 830" fill="none" stroke="#7f8c8d" stroke-width="2"/>
  <path d="M 650 800 L 650 830" fill="none" stroke="#7f8c8d" stroke-width="2"/>

  <text x="400" y="855" text-anchor="middle" font-size="12" fill="#7f8c8d">Continuous Conveyor Feedback Loop</text>
</svg>
