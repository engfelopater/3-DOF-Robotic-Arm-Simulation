<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" width="100%" height="100%" style="background:#f8f9fa; font-family:'Segoe UI', Arial, sans-serif;">
  <!-- Title -->
  <text x="500" y="40" text-anchor="middle" font-size="22" font-weight="bold" fill="#0a3d62">TASK 3: INDUSTRIAL AUTOMATED CONVEYOR SORTING SYSTEM</text>
  <text x="500" y="65" text-anchor="middle" font-size="14" fill="#666">Electrical Schematic &amp; Hardware Interconnect Diagram</text>

  <!-- Power Supply Block -->
  <rect x="50" y="100" width="140" height="90" rx="8" fill="#e74c3c" stroke="#c0392b" stroke-width="2"/>
  <text x="120" y="135" text-anchor="middle" font-size="15" font-weight="bold" fill="#fff">24V / 12V DC</text>
  <text x="120" y="155" text-anchor="middle" font-size="12" fill="#fff">Industrial PSU</text>
  <text x="120" y="175" text-anchor="middle" font-size="11" fill="#ffeaa7">+12V, +5V, GND</text>

  <!-- Microcontroller Block -->
  <rect x="360" y="100" width="280" height="420" rx="12" fill="#2c3e50" stroke="#1a252f" stroke-width="3"/>
  <text x="500" y="135" text-anchor="middle" font-size="18" font-weight="bold" fill="#00d2d3">ATmega328P / PLC</text>
  <text x="500" y="155" text-anchor="middle" font-size="13" fill="#bdc3c7">Central Processing Controller</text>

  <!-- Controller Pins Left (Inputs) -->
  <g fill="#ecf0f1" font-size="12">
    <rect x="365" y="180" width="60" height="24" rx="4" fill="#34495e"/>
    <text x="395" y="196" text-anchor="middle">Pin 2</text>
    <text x="435" y="196" fill="#bdc3c7" font-size="11">IR_INT</text>

    <rect x="365" y="230" width="60" height="24" rx="4" fill="#34495e"/>
    <text x="395" y="246" text-anchor="middle">Pin 3</text>
    <text x="435" y="246" fill="#bdc3c7" font-size="11">PROX_IN</text>

    <rect x="365" y="280" width="60" height="24" rx="4" fill="#34495e"/>
    <text x="395" y="296" text-anchor="middle">Pin 4</text>
    <text x="435" y="296" fill="#bdc3c7" font-size="11">E-STOP</text>

    <rect x="365" y="330" width="60" height="24" rx="4" fill="#34495e"/>
    <text x="395" y="346" text-anchor="middle">A4/A5</text>
    <text x="435" y="346" fill="#bdc3c7" font-size="11">I2C (ToF)</text>
  </g>

  <!-- Controller Pins Right (Outputs) -->
  <g fill="#ecf0f1" font-size="12">
    <rect x="575" y="180" width="60" height="24" rx="4" fill="#34495e"/>
    <text x="605" y="196" text-anchor="middle">Pin 9</text>
    <text x="545" y="196" fill="#bdc3c7" font-size="11">MTR_PWM</text>

    <rect x="575" y="230" width="60" height="24" rx="4" fill="#34495e"/>
    <text x="605" y="246" text-anchor="middle">Pin 7,8</text>
    <text x="545" y="246" fill="#bdc3c7" font-size="11">DIR A/B</text>

    <rect x="575" y="290" width="60" height="24" rx="4" fill="#34495e"/>
    <text x="605" y="306" text-anchor="middle">Pin 5</text>
    <text x="540" y="306" fill="#bdc3c7" font-size="11">SERVO 1</text>

    <rect x="575" y="350" width="60" height="24" rx="4" fill="#34495e"/>
    <text x="605" y="366" text-anchor="middle">Pin 6</text>
    <text x="540" y="366" fill="#bdc3c7" font-size="11">SERVO 2</text>

    <rect x="575" y="420" width="60" height="24" rx="4" fill="#34495e"/>
    <text x="605" y="436" text-anchor="middle">Pin 10-12</text>
    <text x="535" y="436" fill="#bdc3c7" font-size="11">ALARM/LED</text>
  </g>

  <!-- SENSORS (LEFT SIDE) -->
  <!-- IR Sensor -->
  <rect x="50" y="220" width="180" height="60" rx="8" fill="#3498db" stroke="#2980b9" stroke-width="2"/>
  <text x="140" y="245" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">IR Optical Sensor</text>
  <text x="140" y="265" text-anchor="middle" font-size="11" fill="#ecf0f1">E18-D80NK (Item Presence)</text>

  <!-- Inductive Proximity -->
  <rect x="50" y="310" width="180" height="60" rx="8" fill="#9b59b6" stroke="#8e44ad" stroke-width="2"/>
  <text x="140" y="335" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">Inductive Proximity</text>
  <text x="140" y="355" text-anchor="middle" font-size="11" fill="#ecf0f1">LJ12A3 (Metal Detection)</text>

  <!-- ToF Height Sensor -->
  <rect x="50" y="400" width="180" height="60" rx="8" fill="#1abc9c" stroke="#16a085" stroke-width="2"/>
  <text x="140" y="425" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">Laser ToF Sensor</text>
  <text x="140" y="445" text-anchor="middle" font-size="11" fill="#ecf0f1">VL53L0X (Height Profiling)</text>

  <!-- E-Stop Button -->
  <rect x="50" y="490" width="180" height="50" rx="8" fill="#d35400" stroke="#ba4c00" stroke-width="2"/>
  <text x="140" y="520" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">E-STOP NC Button</text>

  <!-- ACTUATORS (RIGHT SIDE) -->
  <!-- Motor Driver -->
  <rect x="760" y="170" width="190" height="85" rx="8" fill="#e67e22" stroke="#d35400" stroke-width="2"/>
  <text x="855" y="200" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">L298N H-Bridge</text>
  <text x="855" y="220" text-anchor="middle" font-size="12" fill="#fff">Motor Driver</text>
  <text x="855" y="240" text-anchor="middle" font-size="11" fill="#fff">-> DC Conveyor Motor (12V)</text>

  <!-- Diverter Servo 1 -->
  <rect x="760" y="280" width="190" height="60" rx="8" fill="#27ae60" stroke="#229954" stroke-width="2"/>
  <text x="855" y="305" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">Diverter Gate 1</text>
  <text x="855" y="325" text-anchor="middle" font-size="11" fill="#fff">MG996R Servo (Metal Bin)</text>

  <!-- Diverter Servo 2 -->
  <rect x="760" y="360" width="190" height="60" rx="8" fill="#2ecc71" stroke="#27ae60" stroke-width="2"/>
  <text x="855" y="385" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">Diverter Gate 2</text>
  <text x="855" y="405" text-anchor="middle" font-size="11" fill="#fff">MG996R Servo (Oversize Bin)</text>

  <!-- Alarm Tower -->
  <rect x="760" y="440" width="190" height="55" rx="8" fill="#c0392b" stroke="#962d22" stroke-width="2"/>
  <text x="855" y="465" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff">Audio-Visual Tower</text>
  <text x="855" y="482" text-anchor="middle" font-size="11" fill="#fff">RGB LEDs &amp; 85dB Buzzer</text>

  <!-- CONNECTING BUS LINES -->
  <!-- Power Lines -->
  <path d="M 190 145 L 360 145" stroke="#e74c3c" stroke-width="3" fill="none" stroke-dasharray="5,5"/>
  <path d="M 190 160 L 760 160 L 760 185" stroke="#e74c3c" stroke-width="2" fill="none"/>

  <!-- Sensor Inputs -->
  <path d="M 230 250 L 365 192" stroke="#2980b9" stroke-width="2" fill="none"/>
  <path d="M 230 340 L 365 242" stroke="#8e44ad" stroke-width="2" fill="none"/>
  <path d="M 230 430 L 365 342" stroke="#16a085" stroke-width="2" fill="none"/>
  <path d="M 230 515 L 300 515 L 300 292 L 365 292" stroke="#d35400" stroke-width="2" fill="none"/>

  <!-- Actuator Outputs -->
  <path d="M 635 192 L 760 192" stroke="#d35400" stroke-width="2" fill="none"/>
  <path d="M 635 242 L 760 215" stroke="#d35400" stroke-width="2" fill="none"/>
  <path d="M 635 302 L 760 302" stroke="#27ae60" stroke-width="2" fill="none"/>
  <path d="M 635 362 L 760 380" stroke="#2ecc71" stroke-width="2" fill="none"/>
  <path d="M 635 432 L 760 460" stroke="#c0392b" stroke-width="2" fill="none"/>

  <!-- Footer Info -->
  <rect x="50" y="580" width="900" height="40" rx="6" fill="#dfe6e9"/>
  <text x="500" y="605" text-anchor="middle" font-size="12" font-weight="bold" fill="#2d3436">Designed for CodeAlpha Robotics &amp; Automation Internship | Industrial System Architecture</text>
</svg>
